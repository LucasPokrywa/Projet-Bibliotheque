services:
  bdd:
    build:
      context: ./bdd
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bibliotheque}
      POSTGRES_USER: ${POSTGRES_USER:-bibliotheque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PGHOST: bdd
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-bibliotheque}
      PGUSER: ${POSTGRES_USER:-bibliotheque}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      bdd:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
