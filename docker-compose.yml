services:
  bdd:
    build:
      context: ./bdd
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bibliotheque}
      POSTGRES_USER: ${POSTGRES_USER:-bibliotheque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PSEUDO: ${ADMIN_PSEUDO:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    env_file:
      - path: ./api/python_script/.env
        required: false
    build:
      context: ./api
    environment:
      NODE_ENV: ${POSTGRES_DB:-production}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env (au moins 32 octets aléatoires)}
      HOST: 0.0.0.0
      PORT: 3000
      PGHOST: bdd
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-bibliotheque}
      PGUSER: ${POSTGRES_USER:-bibliotheque}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      bdd:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health', { signal: AbortSignal.timeout(8000) }).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
